sonar.projectKey=booked_auth_system
sonar.projectName=Booked - Auth System
sonar.sourceEncoding=UTF-8

# Paths
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**

# .NET Specific
sonar.dotnet.excludeGeneratedCode=true

# Coverage thresholds (optional - enforce in Quality Gate)
sonar.projectBaseDir=.
sonar.coverageReportPaths=coverage-report.xml

# C# specific
sonar.cs.roslyn.analyzers=true
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx
